<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Fixed backbone context conditions amino-acid denoising</title>
<desc id="desc">Compact version of Figure 01. Fixed C-alpha residue coordinates and spatial edges condition changing, noisy amino-acid identities. Node features include backbone dihedrals, SASA, surface context, DSSP secondary structure (8 states), and B-factor metadata. Edge features include distance, local frames, sequence offset, and contact. Spatial kNN edges connect nearby residues within 30 angstroms. Noisy amino-acid identity is separate from the fixed geometry and metadata. This is a conceptual schematic, not a molecular prediction.</desc>
